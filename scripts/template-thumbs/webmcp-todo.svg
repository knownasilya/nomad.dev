<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="400" fill="#f5f5f7"/>

  <!-- header -->
  <text x="100" y="70" font-size="28" font-weight="700" fill="#1d1d1f">Todo</text>
  <text x="101" y="94" font-size="13" fill="#8a8a8e">Add tasks — or ask the assistant to manage the list.</text>

  <!-- add form -->
  <rect x="100.5" y="112.5" width="300" height="36" rx="10" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="114" y="135" font-size="14" fill="#8a8a8e">What needs doing?</text>
  <rect x="408" y="112" width="62" height="37" rx="10" fill="#0a84ff"/>
  <text x="439" y="135" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Add</text>

  <!-- filters -->
  <rect x="100.5" y="160.5" width="40" height="24" rx="8" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="120" y="177" font-size="13" fill="#1d1d1f" text-anchor="middle">All</text>
  <text x="154" y="177" font-size="13" fill="#8a8a8e">Active</text>
  <text x="208" y="177" font-size="13" fill="#8a8a8e">Done</text>

  <!-- list -->
  <rect x="100.5" y="196.5" width="370" height="176" rx="12" fill="#ffffff" stroke="#e5e5ea"/>
  <line x1="101" y1="240.5" x2="470" y2="240.5" stroke="#e5e5ea"/>
  <line x1="101" y1="284.5" x2="470" y2="284.5" stroke="#e5e5ea"/>
  <line x1="101" y1="328.5" x2="470" y2="328.5" stroke="#e5e5ea"/>

  <!-- row 1: done -->
  <rect x="116" y="209" width="18" height="18" rx="4" fill="#0a84ff"/>
  <path d="M120 218 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="223" font-size="14" fill="#8a8a8e">Water the plants</text>
  <line x1="148" y1="218" x2="251" y2="218" stroke="#8a8a8e"/>

  <!-- row 2 -->
  <rect x="116.75" y="253.75" width="16.5" height="16.5" rx="4" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="148" y="267" font-size="14" fill="#1d1d1f">Book dentist appointment</text>

  <!-- row 3: done -->
  <rect x="116" y="297" width="18" height="18" rx="4" fill="#0a84ff"/>
  <path d="M120 306 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="311" font-size="14" fill="#8a8a8e">Milk</text>
  <line x1="148" y1="306" x2="172" y2="306" stroke="#8a8a8e"/>

  <!-- row 4 -->
  <rect x="116.75" y="341.75" width="16.5" height="16.5" rx="4" fill="none" stroke="#c7c7cc" stroke-width="1.5"/>
  <text x="148" y="355" font-size="14" fill="#1d1d1f">Eggs</text>

  <!-- footer -->
  <text x="100" y="392" font-size="12" fill="#8a8a8e">2 left · 4 total</text>
  <text x="470" y="392" font-size="12" fill="#0a84ff" text-anchor="end">Clear completed</text>

  <!-- assistant panel -->
  <rect x="500.5" y="96.5" width="210" height="220" rx="14" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="516" y="122" font-size="13" font-weight="700" fill="#1d1d1f">Assistant</text>
  <line x1="501" y1="134.5" x2="710" y2="134.5" stroke="#e5e5ea"/>

  <rect x="548" y="146" width="148" height="44" rx="12" fill="#0a84ff"/>
  <text x="560" y="164" font-size="12" fill="#ffffff">add milk and eggs,</text>
  <text x="560" y="181" font-size="12" fill="#ffffff">then mark milk done</text>

  <rect x="514" y="202" width="106" height="20" rx="6" fill="#f2f2f7"/>
  <text x="524" y="216" font-size="11" font-family="Menlo, monospace" fill="#4b5563">page_add_task</text>
  <rect x="514" y="228" width="140" height="20" rx="6" fill="#f2f2f7"/>
  <text x="524" y="242" font-size="11" font-family="Menlo, monospace" fill="#4b5563">page_complete_task</text>

  <rect x="514" y="258" width="180" height="44" rx="12" fill="#f2f2f7"/>
  <text x="526" y="276" font-size="12" fill="#1d1d1f">Added milk and eggs.</text>
  <text x="526" y="293" font-size="12" fill="#1d1d1f">Milk is done.</text>

  <!-- chat bubble button -->
  <circle cx="688" cy="358" r="22" fill="#0a84ff"/>
  <rect x="677" y="348" width="22" height="15" rx="5" fill="#ffffff"/>
  <path d="M682 362 l-2 7 l8 -7 z" fill="#ffffff"/>
</svg>
