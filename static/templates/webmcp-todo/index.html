<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo</title>
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #fff;
        --ink: #1d1d1f;
        --muted: #8a8a8e;
        --line: #e5e5ea;
        --accent: #0a84ff;
        --danger: #d70015;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --card: #2c2c2e;
          --ink: #f2f2f7;
          --muted: #98989f;
          --line: #3a3a3c;
          --danger: #ff6961;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        justify-content: center;
        padding: 40px 16px 96px;
      }
      main {
        width: 100%;
        max-width: 520px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 20px;
      }
      .tape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        margin-bottom: 16px;
        background: var(--card);
        border-radius: 10px;
        box-shadow: 0 0 0 1px var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .tape strong {
        color: var(--ink);
        font-weight: 500;
      }
      .tape button {
        flex: none;
        padding: 2px 4px;
        background: transparent;
        color: var(--accent);
        font-size: 13px;
      }
      .status {
        margin: -8px 0 16px;
        color: var(--muted);
        font-size: 13px;
      }
      .status.error {
        color: var(--danger);
      }
      form {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
      }
      input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 10px;
      }
      .add-btn {
        padding: 0 16px;
        background: var(--accent);
        color: #fff;
        font-weight: 500;
      }
      .filters {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .filters button {
        padding: 4px 10px;
        font-size: 13px;
        background: transparent;
        color: var(--muted);
        border-radius: 8px;
      }
      .filters button.active {
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--line);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 0 0 1px var(--line);
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-top: 1px solid var(--line);
      }
      li:first-child {
        border-top: none;
      }
      li input[type="checkbox"] {
        width: 18px;
        height: 18px;
        flex: none;
        accent-color: var(--accent);
      }
      li .text {
        flex: 1;
      }
      li.done .text {
        color: var(--muted);
        text-decoration: line-through;
      }
      li .del {
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        padding: 2px 6px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      li:hover .del {
        opacity: 1;
      }
      li .tag {
        flex: none;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .empty {
        padding: 28px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 14px;
      }
      footer {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 13px;
      }
      footer button {
        background: transparent;
        color: var(--accent);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Todo</h1>
      <p class="sub">
        Add tasks below — or open the AI Sidebar (the robot icon in the address bar) and ask it to
        manage the list for you.
      </p>

      <div class="tape" id="tape" hidden>
        <span id="tape-label"></span>
        <button id="tape-btn" type="button"></button>
      </div>
      <p class="status" id="status" hidden></p>

      <form id="add-form">
        <input id="add-input" type="text" placeholder="What needs doing?" autocomplete="off" />
        <button class="add-btn" type="submit">Add</button>
      </form>

      <div class="filters" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="done">Done</button>
      </div>

      <ul id="list"></ul>

      <footer>
        <span id="count"></span>
        <button id="clear-done" type="button" hidden>Clear completed</button>
      </footer>
    </main>

    <script>
      // --- storage: a drive you insert, or this browser ---------------------
      // Like a cassette in a player: this page is the player, and your tasks can live in a drive
      // you choose (the tape). Then the list goes where that drive goes, to your other devices
      // too. With no drive inserted, the list stays in this browser (localStorage).
      //
      // In the drive, the list is the file /todos.json. Any JSON works if it holds a list of items
      // that each have a string `name` and a string `status`. The list can be the whole file or
      // one field of it, and this page keeps every other field when it saves. A status of "done",
      // "completed", "complete" or "closed" counts as done. This convention is made up for this
      // demo; it is not a schema Nomad knows. A list this page starts looks like this:
      //   { "type": "nomad-demo/todo-list",
      //     "tasks": [{ "id": "k3j9x1a", "name": "Buy milk", "status": "todo", "createdAt": "<ISO date>" }] }
      const TAPE_FILE = "/todos.json";
      const LOCAL_KEY = "todo:" + location.origin;
      const TAPE_KEY = "todo-tape:" + location.origin;
      const DONE = ["done", "completed", "complete", "closed"];
      const LIST_FIELDS = ["tasks", "items", "todos"]; // looked at first, in this order
      const canUseDrives = !!(window.nomad && nomad.fs && nomad.shell);

      const newDoc = () => ({ type: "nomad-demo/todo-list", tasks: [] });
      /** The whole file as read. Saving writes it back with the list put in again. */
      let doc = newDoc();
      /** The field of `doc` that holds the list, or null when the file is the list itself. */
      let listField = "tasks";
      /** @type {{name:string,status:string,[field:string]:any}[]} */
      let tasks = [];
      let filter = "all";
      /** The inserted drive, or null. @type {null | {url:string,title:string,watcher:any,lastWritten:string,pending:number}} */
      let tape = null;
      let saving = Promise.resolve();

      const uid = () => Math.random().toString(36).slice(2, 9);
      const isTask = (t) => !!t && typeof t.name === "string" && typeof t.status === "string";
      const isDone = (t) => DONE.includes(t.status.toLowerCase());

      // Find the list in parsed JSON: { doc, listField, tasks }, or null when it holds none.
      function readList(json) {
        if (Array.isArray(json)) {
          return json.every(isTask) ? { doc: json, listField: null, tasks: json } : null;
        }
        if (!json || typeof json !== "object") return null;
        for (const field of [...LIST_FIELDS, ...Object.keys(json)]) {
          const list = json[field];
          if (!Array.isArray(list) || !list.every(isTask)) continue;
          if (!list.length && !LIST_FIELDS.includes(field)) continue; // an empty array proves nothing
          return { doc: json, listField: field, tasks: list };
        }
        return null;
      }
      function setList(found) {
        doc = found.doc;
        listField = found.listField;
        tasks = found.tasks;
      }
      const toJSON = () =>
        JSON.stringify(listField === null ? tasks : { ...doc, [listField]: tasks }, null, 2);

      function loadLocal() {
        let json = null;
        try {
          json = JSON.parse(localStorage.getItem(LOCAL_KEY));
        } catch {}
        // Older versions of this page kept [{ id, text, done }] here.
        if (Array.isArray(json) && json.length && json.every((t) => t && typeof t.text === "string")) {
          const tasks = json.map((t) => ({ id: t.id || uid(), name: t.text, status: t.done ? "done" : "todo" }));
          json = { ...newDoc(), tasks };
        }
        return readList(json) || readList(newDoc());
      }

      // The list on a drive, or null for a blank drive (no /todos.json yet). Throws when the
      // drive's /todos.json holds no list, so this page never writes over it.
      async function readTape(drive) {
        const st = await drive.stat(TAPE_FILE).catch(() => null);
        if (!st) return null;
        let found = null;
        try {
          found = readList(JSON.parse(await drive.readFile(TAPE_FILE)));
        } catch {}
        if (!found) throw new Error(`its ${TAPE_FILE} has no list of items with a name and a status`);
        return found;
      }

      function save() {
        if (!tape) {
          try {
            localStorage.setItem(LOCAL_KEY, toJSON());
          } catch {}
          return;
        }
        // Writes go out one at a time, in order. The first one asks you once for permission to
        // write to the drive, unless it is this page's own drive.
        const t = tape;
        const json = toJSON();
        t.pending++;
        saving = saving
          .then(() => nomad.fs.drive(t.url).writeFile(TAPE_FILE, json))
          .then(() => {
            t.lastWritten = json;
            showStatus("");
          })
          .catch((e) => showStatus(`Could not save to ${t.title}: ${e.message}`, true))
          .finally(() => t.pending--);
      }

      // Insert a drive. A blank drive starts with the list you have now.
      async function useDrive(url) {
        const drive = nomad.fs.drive(url);
        const info = await drive.getInfo();
        const found = await readTape(drive);
        tape = { url, title: info.title || "Untitled drive", watcher: null, lastWritten: "", pending: 0 };
        if (found) setList(found);
        else save();
        try {
          tape.watcher = drive.watch(TAPE_FILE, onTapeChanged);
        } catch {}
        localStorage.setItem(TAPE_KEY, url);
        render();
      }

      // /todos.json changed: on another device, in another app, or by our own save.
      async function onTapeChanged() {
        const t = tape;
        if (!t || t.pending) return; // our own save is still landing; the newest list here wins
        try {
          const text = await nomad.fs.drive(t.url).readFile(TAPE_FILE);
          if (tape !== t || text === t.lastWritten) return;
          const found = readList(JSON.parse(text));
          if (!found) return;
          t.lastWritten = text;
          setList(found);
          render();
        } catch {}
      }

      async function insert() {
        let url;
        try {
          url = await nomad.shell.selectDriveDialog({
            title: "Choose a drive for your tasks",
            buttonLabel: "Use this drive",
            writable: true,
            tag: "todo",
          });
        } catch {
          return; // the picker was closed
        }
        try {
          await useDrive(url);
          showStatus("");
        } catch (e) {
          showStatus(`Can't use that drive: ${e.message}`, true);
        }
      }

      // Take the drive out. The list goes back to the one in this browser.
      function eject() {
        if (tape && tape.watcher) tape.watcher.close();
        tape = null;
        localStorage.removeItem(TAPE_KEY);
        setList(loadLocal());
        showStatus("");
        render();
      }

      async function boot() {
        const url = canUseDrives && localStorage.getItem(TAPE_KEY);
        if (url) {
          try {
            return await useDrive(url);
          } catch (e) {
            localStorage.removeItem(TAPE_KEY);
            showStatus(`Could not open your tasks drive (${e.message}), so the list is back in this browser.`, true);
          }
        }
        setList(loadLocal());
        render();
      }

      // --- mutations (shared by the UI and the WebMCP tools) ----------------
      function addTask(name) {
        name = String(name || "").trim();
        if (!name) throw new Error("Task text is required");
        const task = { id: uid(), name, status: "todo", createdAt: new Date().toISOString() };
        tasks.push(task);
        save();
        render();
        return task;
      }
      // A task by id or name (exact, then partial). The UI passes the task itself.
      function findTask(ref) {
        if (tasks.includes(ref)) return ref;
        const key = String(ref || "").trim();
        const low = key.toLowerCase();
        if (!key) return null;
        return (
          tasks.find((t) => t.id === key) ||
          tasks.find((t) => t.name.toLowerCase() === low) ||
          tasks.find((t) => t.name.toLowerCase().includes(low)) ||
          null
        );
      }
      // Change the status only when done-ness changes, so a list that says "completed" keeps it.
      function setDone(ref, done) {
        const t = findTask(ref);
        if (!t) throw new Error(`No task matching "${ref}"`);
        if (isDone(t) !== done) t.status = done ? "done" : "todo";
        save();
        render();
        return t;
      }
      function removeTask(ref) {
        const t = findTask(ref);
        if (!t) throw new Error(`No task matching "${ref}"`);
        tasks.splice(tasks.indexOf(t), 1);
        save();
        render();
        return t;
      }
      function clearCompleted() {
        const n = tasks.filter(isDone).length;
        for (let i = tasks.length - 1; i >= 0; i--) if (isDone(tasks[i])) tasks.splice(i, 1);
        save();
        render();
        return n;
      }

      // --- rendering -------------------------------------------------------
      const list = document.getElementById("list");
      const countEl = document.getElementById("count");
      const clearBtn = document.getElementById("clear-done");
      const tapeEl = document.getElementById("tape");
      const tapeLabel = document.getElementById("tape-label");
      const tapeBtn = document.getElementById("tape-btn");
      const statusEl = document.getElementById("status");

      function showStatus(text, isError = false) {
        statusEl.textContent = text;
        statusEl.hidden = !text;
        statusEl.classList.toggle("error", isError);
      }

      function renderTape() {
        tapeEl.hidden = !canUseDrives;
        tapeLabel.textContent = "";
        if (tape) {
          const name = document.createElement("strong");
          name.textContent = tape.title;
          tapeLabel.append("Saved in the drive ", name);
          tapeBtn.textContent = "Eject";
        } else {
          tapeLabel.textContent = "Saved in this browser only";
          tapeBtn.textContent = "Use a drive";
        }
      }

      // A status other than "todo" or done, like "in progress", shows as a label.
      const otherStatus = (t) => (!isDone(t) && t.status.toLowerCase() !== "todo" ? t.status : "");

      function render() {
        renderTape();
        const shown = tasks.filter((t) =>
          filter === "all" ? true : filter === "done" ? isDone(t) : !isDone(t)
        );
        list.innerHTML = "";
        if (!shown.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = tasks.length ? "Nothing here." : "No tasks yet.";
          list.append(li);
        }
        for (const t of shown) {
          const li = document.createElement("li");
          li.className = isDone(t) ? "done" : "";

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = isDone(t);
          cb.addEventListener("change", () => setDone(t, cb.checked));

          const span = document.createElement("span");
          span.className = "text";
          span.textContent = t.name;
          li.append(cb, span);

          if (otherStatus(t)) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = otherStatus(t);
            li.append(tag);
          }

          const del = document.createElement("button");
          del.className = "del";
          del.type = "button";
          del.textContent = "×";
          del.title = "Delete";
          del.addEventListener("click", () => removeTask(t));

          li.append(del);
          list.append(li);
        }
        const left = tasks.filter((t) => !isDone(t)).length;
        countEl.textContent = `${left} left · ${tasks.length} total`;
        clearBtn.hidden = !tasks.some(isDone);
      }

      document.getElementById("add-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("add-input");
        if (input.value.trim()) addTask(input.value);
        input.value = "";
        input.focus();
      });
      document.getElementById("filters").addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-filter]");
        if (!btn) return;
        filter = btn.dataset.filter;
        document
          .querySelectorAll("#filters button")
          .forEach((b) => b.classList.toggle("active", b === btn));
        render();
      });
      clearBtn.addEventListener("click", clearCompleted);
      tapeBtn.addEventListener("click", () => (tape ? eject() : insert()));
      boot();

      // --- WebMCP: expose the list to the AI assistant ---------------------
      // https://nomad.pages.dev/docs/api/developers/webmcp
      const mc = document.modelContext; // (navigator.modelContext is a deprecated alias)
      const ok = (text) => ({ content: [{ type: "text", text }] });
      const summary = (t) =>
        `${isDone(t) ? "[x]" : "[ ]"} ${t.name}${otherStatus(t) ? ` (${otherStatus(t)})` : ""}`;

      mc.registerTool({
        name: "add_task",
        description: "Add a task to the todo list.",
        inputSchema: {
          type: "object",
          properties: { text: { type: "string", description: "The task to add" } },
          required: ["text"],
        },
        execute: ({ text }) => ok(`Added: ${addTask(text).name}`),
      });

      mc.registerTool({
        name: "list_tasks",
        description: "List the tasks. Optionally filter by status.",
        inputSchema: {
          type: "object",
          properties: {
            status: { type: "string", enum: ["all", "active", "done"], description: "Defaults to all" },
          },
        },
        execute: ({ status = "all" }) => {
          const rows = tasks.filter((t) =>
            status === "done" ? isDone(t) : status === "active" ? !isDone(t) : true
          );
          return ok(rows.length ? rows.map(summary).join("\n") : "(no tasks)");
        },
      });

      mc.registerTool({
        name: "complete_task",
        description: "Mark a task as done. Match by its text (or id).",
        inputSchema: {
          type: "object",
          properties: { task: { type: "string", description: "Task text or id" } },
          required: ["task"],
        },
        execute: ({ task }) => ok(`Completed: ${setDone(task, true).name}`),
      });

      mc.registerTool({
        name: "reopen_task",
        description: "Mark a completed task as active again. Match by its text (or id).",
        inputSchema: {
          type: "object",
          properties: { task: { type: "string", description: "Task text or id" } },
          required: ["task"],
        },
        execute: ({ task }) => ok(`Reopened: ${setDone(task, false).name}`),
      });

      mc.registerTool({
        name: "remove_task",
        description: "Delete a task from the list. Match by its text (or id).",
        inputSchema: {
          type: "object",
          properties: { task: { type: "string", description: "Task text or id" } },
          required: ["task"],
        },
        execute: ({ task }) => ok(`Removed: ${removeTask(task).name}`),
      });

      mc.registerTool({
        name: "clear_completed",
        description: "Delete every completed task.",
        inputSchema: { type: "object", properties: {} },
        execute: () => ok(`Cleared ${clearCompleted()} completed task(s)`),
      });
    </script>
  </body>
</html>
